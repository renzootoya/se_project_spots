<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spots Tripleten Project" />
    <meta name="author" content="Renzo Otoya" />
    <meta name="keywords" content="HTML,CSS,ETC" />
    <link rel="icon" type="images/x-icon" href="./images/favicon.ico" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img src="<%=require('./images/logo.svg')%>" alt="Spots logo" class="header__logo" />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
          <button type="button" class="profile__avatar-btn"><img
            src="<%=require('./images/pencil-light-icon.svg')%>"
            alt="pencil light icon"
            class="profile__pencil-icon"
          />
        </button>
          <img
            src="<%=require('./images/avatar.jpg')%>"
            alt="Bessie Coleman"
            class="profile__avatar"
          />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              <img src="<%=require('./images/pencil.svg')%>" alt="Pencil icon"  />Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-btn">
            <img src="<%=require('./images/plus.svg')%>" alt="Plus Icon" class="profile__add-icon" />New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button class="card__delete-button" type="button">
                  <img
                    src="<%=require('./images/DeleteIcon.svg')%>"
                    alt="delete icon"
                  />
                </button>
                <img src="" alt="" class="card__image" />
                <div class="card__footer">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-btn"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">2023 © Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
            <img
              src="<%=require('./images/closebottomicon.svg')%>"
              alt="close button icon"
            />
          </button>
          <h2 class="modal__title">Edit profile</h2>
          <form class="modal__form" novalidate>
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                required
                maxlength="40"
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>
            <label for="profile-description-input" class="modal__label"
              >Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                required
                maxlength="200"
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button type="submit" class="modal__submit-btn modal__button">
              Save
            </button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
            <img
              src="<%=require('./images/close-btn-default.svg')%>"
              alt="Black X shaped close button icon with a neutral tone on a transparent background"
              class="modal__close-icon"
              />
          </button>
          <h2 class="modal__title">New Post</h2>
          <form class="modal__form modal__form-new-post" novalidate>
            <label for="post-image-input" class="modal__label">
              Image link
              <input
                id="post-image-input"
                class="modal__input"
                placeholder="Paste a link to the picture"
                type="url"
                required
              />
              <span id="post-image-input-error" class="modal__error"></span>
            </label>
            <label for="post-caption-input" class="modal__label"
              >Caption
              <input
                id="post-caption-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                required
                maxlength="30"
              />
              <span id="post-caption-input-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__submit-btn modal__button">
              Save
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="modal modal_type_preview" id="preview-modal">
      <div class="modal__image-container">
        <button
          aria-label="Close modal"
          class="modal__close-btn modal__close-btn_type_preview"
          type="button"
        ></button>
        <img
          src="<%=require('./images/closebottomicon.svg')%>"
          alt="Black X shaped close button icon with a neutral tone on a transparent background"
          class="modal__image"
        />
        <p class="modal__caption"></p>
      </div>
    </div>
 <div class="modal" id="avatar-modal">
        <div class="modal__container profile__avatar-modal">
          <button type="button" class="modal__close-btn">
            <img
              class="modal__close-icon"
              src="<%=require('./images/closebottomicon.svg')%>"
              alt="close button icon"
            />
          </button>
          <h2 class="modal__title">Edit Profile Avatar</h2>
          <form class="modal__form" novalidate id="edit-avatar-form">
            <label for="profile-avatar-input" class="modal__label">
              Avatar 
              <input
                id="profile-avatar-input"
                name="avatar"
                class="modal__input"
                placeholder="Avatar goes here"
                required
              />
              <span id="profile-avatar-input-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__submit-btn modal__button">
              Save
            </button>
          </form>
        </div>
      </div>

      <div class="modal" id="delete-modal">
  <div class="modal__container-delete">
    <button type="button" class="modal__close-btn-delete">
    </button>
    
    <h2 class="modal__title-delete">Are you sure you want to delete this image?</h2>
    <form class="modal__form-delete modal__form" novalidate id="delete-form">
      <button type="submit" class="modal__delete-btn modal__button modal__submit-btn">Delete</button>
      <button type="button" class="modal__cancel-btn modal__button">Cancel</button>
    </form>
  </div>
</div>
  </body>
</html>
